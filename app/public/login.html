<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FinBot 100 — Sign in</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { overflow: auto; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .login { width: 100%; max-width: 380px; }
    .login .brand { margin-bottom: 22px; justify-content: center; }
    .login label { display: block; font-size: 12px; color: var(--dim); margin: 14px 0 6px; letter-spacing: 0.5px; }
    .login input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-solid); color: var(--text); font-size: 14px; }
    .login input:focus { outline: none; border-color: var(--accent); }
    .login .btn { width: 100%; margin-top: 20px; padding: 12px; }
    .login .err { color: var(--red); font-size: 12.5px; margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="login panel" id="f">
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>FINBOT 100</h1>
        <div class="sub">Financial Intelligence</div>
      </div>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      document.getElementById('err').textContent = '';
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
        });
        const j = await r.json();
        if (r.ok) return location.replace('/' + (location.hash || ''));
        document.getElementById('err').textContent = j.error || 'Sign-in failed.';
      } catch {
        document.getElementById('err').textContent = 'Server unreachable.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
